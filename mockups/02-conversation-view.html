<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PODU - Conversation View Mockup (Candy Pop)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/uncut-sans@5.2.5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/uncut-sans@5.2.5/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/uncut-sans@5.2.5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/uncut-sans@5.2.5/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/uncut-sans@5.2.5/800.css">
  <style>
    :root {
      --candy-purple: #9B5DE5;
      --candy-pink: #F15BB5;
      --candy-yellow: #FEE440;
      --candy-blue: #00BBF9;
      --candy-mint: #00F5D4;
      --bg: #0f0a1a;
      --text: #f0ecf7;
      --text-muted: rgba(240, 236, 247, 0.5);
      --border: rgba(155, 93, 229, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'Uncut Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .conversation {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* === ANIMATED BACKGROUND === */
    .conv-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .conv-bg-gradient {
      position: absolute;
      inset: 0;
      opacity: 0.4;
    }
    .conv-bg-gradient.fun { background: linear-gradient(135deg, rgba(244,114,182,0.15), rgba(241,91,181,0.2), rgba(225,29,143,0.1)); }
    .conv-bg-gradient.edu { background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(0,187,249,0.2), rgba(2,132,199,0.1)); }
    .conv-bg-gradient.deep { background: linear-gradient(135deg, rgba(167,139,250,0.15), rgba(155,93,229,0.2), rgba(124,58,237,0.1)); }

    .floating-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.15;
      animation: float-orb ease-in-out infinite;
    }
    .orb-1 { width: 200px; height: 200px; left: 10%; top: 25%; animation-duration: 7s; }
    .orb-2 { width: 250px; height: 250px; right: 5%; top: 35%; animation-duration: 8s; animation-delay: 1s; }
    .orb-3 { width: 180px; height: 180px; left: 30%; top: 55%; animation-duration: 6s; animation-delay: 2s; }
    .orb-4 { width: 220px; height: 220px; right: 20%; top: 15%; animation-duration: 9s; animation-delay: 0.5s; }
    .orb-5 { width: 160px; height: 160px; left: 60%; top: 65%; animation-duration: 7.5s; animation-delay: 1.5s; }

    .fun .floating-orb { background: var(--candy-pink); }
    .edu .floating-orb { background: var(--candy-blue); }
    .deep .floating-orb { background: var(--candy-purple); }

    @keyframes float-orb {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(5deg); }
    }

    /* === HEADER === */
    .conv-header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }
    .conv-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mode-badge {
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: white;
    }
    .mode-badge.fun { background: var(--candy-pink); }
    .mode-badge.edu { background: var(--candy-blue); }
    .mode-badge.deep { background: var(--candy-purple); }

    .topic-count {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(26, 18, 46, 0.5);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: background 0.2s;
    }
    .close-btn:hover { background: rgba(26, 18, 46, 0.8); }

    /* === MAIN AREA === */
    .conv-main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Status pill */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(26, 18, 46, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      margin-bottom: 40px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status-text {
      font-size: 11px;
      color: rgba(240, 236, 247, 0.8);
      letter-spacing: 0.3px;
    }

    /* Play button (active state) */
    .conv-play-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ripple animations */
    .ripple {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      animation: ripple-out 1.5s ease-out infinite;
    }
    .ripple:nth-child(2) { animation-delay: 0.5s; }
    .ripple:nth-child(3) { animation-delay: 1s; }

    .fun .ripple { background: rgba(241, 91, 181, 0.2); }
    .edu .ripple { background: rgba(0, 187, 249, 0.2); }
    .deep .ripple { background: rgba(155, 93, 229, 0.2); }

    @keyframes ripple-out {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .conv-play-glow {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      filter: blur(30px);
      transition: background 0.5s;
    }
    .fun .conv-play-glow { background: linear-gradient(135deg, #f472b6, var(--candy-pink)); opacity: 0.5; }
    .edu .conv-play-glow { background: linear-gradient(135deg, #38bdf8, var(--candy-blue)); opacity: 0.5; }
    .deep .conv-play-glow { background: linear-gradient(135deg, #a78bfa, var(--candy-purple)); opacity: 0.5; }

    .conv-play-btn {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      animation: pulse-glow 2s ease-in-out infinite;
    }
    .fun .conv-play-btn {
      background: linear-gradient(135deg, #f472b6, var(--candy-pink), #e11d8f);
      box-shadow: 0 0 50px rgba(241, 91, 181, 0.4);
    }
    .edu .conv-play-btn {
      background: linear-gradient(135deg, #38bdf8, var(--candy-blue), #0284c7);
      box-shadow: 0 0 50px rgba(0, 187, 249, 0.4);
    }
    .deep .conv-play-btn {
      background: linear-gradient(135deg, #a78bfa, var(--candy-purple), #7c3aed);
      box-shadow: 0 0 50px rgba(155, 93, 229, 0.4);
    }
    .conv-play-btn::after {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    .mic-icon {
      position: relative;
      z-index: 1;
      width: 44px;
      height: 44px;
      color: white;
      animation: mic-pulse 1.5s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    /* Audio visualizer */
    .visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
      height: 48px;
      margin-top: 60px;
    }
    .viz-bar {
      width: 3px;
      border-radius: 2px;
      transition: height 0.15s ease;
      animation: waveform ease-in-out infinite;
    }
    .fun .viz-bar { background: var(--candy-pink); }
    .edu .viz-bar { background: var(--candy-blue); }
    .deep .viz-bar { background: var(--candy-purple); }

    @keyframes waveform {
      0%, 100% { height: 20%; }
      50% { height: 100%; }
    }

    /* === FOOTER === */
    .conv-footer {
      position: relative;
      z-index: 10;
      padding: 24px;
      padding-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .footer-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(26, 18, 46, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: background 0.2s;
    }
    .footer-btn:hover { background: rgba(26, 18, 46, 0.8); }
    .footer-pill {
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(26, 18, 46, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    /* === MODE SWITCHER TABS === */
    .mode-tabs {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(26, 18, 46, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border);
      z-index: 20;
    }
    .mode-tab {
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      background: transparent;
      color: var(--text-muted);
    }
    .mode-tab.active-tab {
      color: white;
    }
    .mode-tab.fun-tab.active-tab { background: var(--candy-pink); }
    .mode-tab.edu-tab.active-tab { background: var(--candy-blue); }
    .mode-tab.deep-tab.active-tab { background: var(--candy-purple); }
  </style>
</head>
<body>
  <div class="conversation fun" id="convRoot">
    <!-- Animated background -->
    <div class="conv-bg">
      <div class="conv-bg-gradient fun" id="bgGradient"></div>
      <div class="floating-orb orb-1"></div>
      <div class="floating-orb orb-2"></div>
      <div class="floating-orb orb-3"></div>
      <div class="floating-orb orb-4"></div>
      <div class="floating-orb orb-5"></div>
    </div>

    <!-- Header -->
    <header class="conv-header">
      <div class="conv-header-left">
        <div class="mode-badge fun" id="modeBadge">FUN</div>
        <span class="topic-count">2 topics</span>
      </div>
      <button class="close-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>

    <!-- Mode switcher (for demo) -->
    <div class="mode-tabs">
      <button class="mode-tab fun-tab active-tab" onclick="switchMode('fun')">FUN</button>
      <button class="mode-tab edu-tab" onclick="switchMode('edu')">EDU</button>
      <button class="mode-tab deep-tab" onclick="switchMode('deep')">DEEP</button>
    </div>

    <!-- Main -->
    <main class="conv-main">
      <!-- Status pill -->
      <div class="status-pill">
        <div class="status-dot"></div>
        <span class="status-text">Host is speaking...</span>
      </div>

      <!-- Play button with ripples -->
      <div class="conv-play-wrap">
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="ripple"></div>
        <div class="conv-play-glow"></div>
        <div class="conv-play-btn">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </div>
      </div>

      <!-- Audio visualizer -->
      <div class="visualizer" id="visualizer">
      </div>
    </main>

    <!-- Footer -->
    <footer class="conv-footer">
      <button class="footer-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <div class="footer-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        Live
      </div>
    </footer>
  </div>

  <script>
    // Create visualizer bars
    const viz = document.getElementById('visualizer');
    for (let i = 0; i < 20; i++) {
      const bar = document.createElement('div');
      bar.className = 'viz-bar';
      bar.style.animationDuration = `${0.8 + Math.random() * 0.8}s`;
      bar.style.animationDelay = `${i * 0.05}s`;
      bar.style.opacity = '0.7';
      viz.appendChild(bar);
    }

    function switchMode(mode) {
      const root = document.getElementById('convRoot');
      const badge = document.getElementById('modeBadge');
      const bgGrad = document.getElementById('bgGradient');

      // Remove all mode classes
      root.className = 'conversation ' + mode;
      badge.className = 'mode-badge ' + mode;
      bgGrad.className = 'conv-bg-gradient ' + mode;
      badge.textContent = mode.toUpperCase();

      // Update tab
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active-tab'));
      document.querySelector(`.${mode}-tab`).classList.add('active-tab');
    }
  </script>
</body>
</html>
